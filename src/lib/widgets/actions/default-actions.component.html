<div class="app-actions mb-2">
  <div class="row g-2 align-items-stretch">
    <!-- Left Side (Search) -->
    <div class="col-md-7 justify-content-start">
      <div class="d-flex flex-wrap align-items-stretch gap-2">
        <!-- Search Bar -->
        <div *ngIf="searchChange.subscriberCount" class="input-group" style="width: 240px">
          <span class="input-group-text bg-white">
            <i class="fas fa-search text-muted"></i>
          </span>
          <input type="text" class="form-control" placeholder="Search..." [(ngModel)]="search" (keyup.enter)="onSearch()" />
          <button class="btn btn-primary" (click)="onSearch()" title="Search">
            <i class="fas fa-arrow-right"></i>
          </button>
        </div>

      </div>
    </div>

    <!-- Right Side (Action Buttons) -->
    <div class="col-md-5">
      <div class="d-flex flex-wrap justify-content-end align-items-stretch gap-2">
        <ng-template #menuItemTpl let-item>
          <button
            type="button"
            role="menuitem"
            class="dropdown-item d-flex align-items-center gap-2 text-wrap py-2"
            [class.text-danger]="item.danger"
            [disabled]="item.isDisabled"
            [attr.aria-busy]="item.busy || null"
            [attr.title]="item.hint || null"
            (click)="item.choose($event)"
          >
            <i [class]="item.icon" class="fa-fw" [class.text-primary]="!item.danger && !item.isDisabled" *ngIf="item.icon && !item.busy"></i>
            <i class="fa-solid fa-spinner fa-spin fa-fw" *ngIf="item.busy"></i>
            <span>
              <span class="fw-medium"><ng-container *ngTemplateOutlet="item.label"></ng-container></span>
              <small *ngIf="item.hint" class="d-block text-body-secondary fw-normal">{{ item.hint }}</small>
            </span>
          </button>
        </ng-template>

        <!-- Create Button -->
        <button *ngIf="create.subscriberCount && !_hide?.create" [disabled]="_disabled?.create ?? false" class="btn btn-sm btn-primary" [ngClass]="getDisplayClasses()" (click)="onCreate($event)">
          <i class="fa-solid fa-plus" *ngIf="showIcon()"></i>
          <span *ngIf="showText()">Create</span>
        </button>

        <!-- Hire Button -->
        <button *ngIf="hire.subscriberCount && !_hide?.hire" [disabled]="_disabled?.hire ?? false" class="btn btn-sm btn-primary" [ngClass]="getDisplayClasses()" (click)="onHire($event)">
          <i class="fa-solid fa-user-plus" *ngIf="showIcon()"></i>
          <span *ngIf="showText()">{{ label('hire', 'Hire') }}</span>
        </button>

        <!-- Workspace Button -->
        <button *ngIf="workspace.subscriberCount && !_hide?.workspace" [disabled]="_disabled?.workspace ?? false" class="btn btn-sm btn-outline-primary" [ngClass]="getDisplayClasses()" (click)="onWorkspace($event)">
          <i class="fa-solid fa-briefcase" *ngIf="showIcon()"></i>
          <span *ngIf="showText()">{{ label('workspace', 'Go To Workspace') }}</span>
        </button>

        <!-- Edit Button -->
        <button *ngIf="edit.subscriberCount && !_hide?.edit" [disabled]="_disabled?.edit ?? false" class="btn btn-sm btn-outline-primary" [ngClass]="getDisplayClasses()" (click)="onEdit($event)">
          <i class="fa-solid fa-pencil" *ngIf="showIcon()"></i>
          <span *ngIf="showText()">Edit</span>
        </button>

        <!-- Update Button -->
        <button *ngIf="update.subscriberCount && !_hide?.update" [disabled]="_disabled?.update ?? false" class="btn btn-sm btn-primary" [ngClass]="getDisplayClasses()" (click)="onUpdate($event)">
          <i class="fa-solid fa-save" *ngIf="showIcon()"></i>
          <span *ngIf="showText()">Update</span>
        </button>

        <!-- Save Button -->
        <button *ngIf="save.subscriberCount && !_hide?.save" [disabled]="_disabled?.save ?? false" class="btn btn-sm btn-primary" [ngClass]="getDisplayClasses()" (click)="onSave($event)">
          <i class="fa-solid fa-save" *ngIf="showIcon()"></i>
          <span *ngIf="showText()">Save</span>
        </button>

        <!-- View Button -->
        <button *ngIf="view.subscriberCount && !_hide?.view" [disabled]="_disabled?.view ?? false" class="btn btn-sm btn-outline-info" [ngClass]="getDisplayClasses()" (click)="onView($event)">
          <i class="fa-solid fa-info-circle" *ngIf="showIcon()"></i>
          <span *ngIf="showText()">View</span>
        </button>

        <!-- Delete Button -->
        <button *ngIf="delete.subscriberCount && !_hide?.delete" [disabled]="_disabled?.delete ?? false" class="btn btn-sm btn-outline-danger" [ngClass]="getDisplayClasses()" (click)="onDelete($event)">
          <i class="fa-solid fa-trash" *ngIf="showIcon()"></i>
          <span *ngIf="showText()">Delete</span>
        </button>

        <!-- Activate Button -->
        <button
          *ngIf="activate.subscriberCount && !_hide?.activate"
          [disabled]="_disabled?.activate ?? false"
          class="btn btn-sm btn-outline-success"
          [ngClass]="getDisplayClasses()"
          (click)="onActivate($event)"
        >
          <i class="fa-solid fa-lock-open" *ngIf="showIcon()"></i>
          <span *ngIf="showText()">Activate</span>
        </button>

        <!-- Deactivate Button -->
        <button
          *ngIf="deactivate.subscriberCount && !_hide?.deactivate"
          [disabled]="_disabled?.deactivate ?? false"
          class="btn btn-sm btn-outline-warning"
          [ngClass]="getDisplayClasses()"
          (click)="onDeactivate($event)"
        >
          <i class="fa-solid fa-lock" *ngIf="showIcon()"></i>
          <span *ngIf="showText()">Deactivate</span>
        </button>

        <!-- Enable Button -->
        <button *ngIf="enable.subscriberCount && !_hide?.enable" [disabled]="_disabled?.enable ?? false" class="btn btn-sm btn-outline-success" [ngClass]="getDisplayClasses()" (click)="onEnable($event)">
          <i class="fa-solid fa-lock-open" *ngIf="showIcon()"></i>
          <span *ngIf="showText()">Enable</span>
        </button>

        <!-- Disable Button -->
        <button *ngIf="disable.subscriberCount && !_hide?.disable" [disabled]="_disabled?.disable ?? false" class="btn btn-sm btn-outline-warning" [ngClass]="getDisplayClasses()" (click)="onDisable($event)">
          <i class="fa-solid fa-lock" *ngIf="showIcon()"></i>
          <span *ngIf="showText()">Disable</span>
        </button>

        <!-- Attach Button -->
        <button *ngIf="attach.subscriberCount && !_hide?.attach" [disabled]="_disabled?.attach ?? false" class="btn btn-sm btn-outline-success" [ngClass]="getDisplayClasses()" (click)="onAttach($event)">
          <i class="fa-solid fa-link" *ngIf="showIcon()"></i>
          <span *ngIf="showText()">Attach</span>
        </button>

        <!-- Detach Button -->
        <button *ngIf="detach.subscriberCount && !_hide?.detach" [disabled]="_disabled?.detach ?? false" class="btn btn-sm btn-outline-warning" [ngClass]="getDisplayClasses()" (click)="onDetach($event)">
          <i class="fa-solid fa-unlink" *ngIf="showIcon()"></i>
          <span *ngIf="showText()">Detach</span>
        </button>

        <!-- Assign Button -->
        <button *ngIf="assign.subscriberCount && !_hide?.assign" [disabled]="_disabled?.assign ?? false" class="btn btn-sm btn-outline-success" [ngClass]="getDisplayClasses()" (click)="onAssign($event)">
          <i class="fa-solid fa-user-plus" *ngIf="showIcon()"></i>
          <span *ngIf="showText()">Assign</span>
        </button>

        <!-- Remove Button -->
        <button *ngIf="remove.subscriberCount && !_hide?.remove" [disabled]="_disabled?.remove ?? false" class="btn btn-sm btn-outline-warning" [ngClass]="getDisplayClasses()" (click)="onRemove($event)">
          <i class="fa-solid fa-minus" *ngIf="showIcon()"></i>
          <span *ngIf="showText()">Remove</span>
        </button>

        <!-- Revoke Button -->
        <button *ngIf="revoke.subscriberCount && !_hide?.revoke" [disabled]="_disabled?.revoke ?? false" class="btn btn-sm btn-outline-warning" [ngClass]="getDisplayClasses()" (click)="onRevoke($event)">
          <i class="fa-solid fa-ban" *ngIf="showIcon()"></i>
          <span *ngIf="showText()">Revoke</span>
        </button>

        <!-- Import Button -->
        <button *ngIf="import.subscriberCount && !_hide?.import" [disabled]="_disabled?.import ?? false" class="btn btn-sm btn-outline-info" [ngClass]="getDisplayClasses()" (click)="onImport($event)">
          <i class="fa-solid fa-file-import" *ngIf="showIcon()"></i>
          <span *ngIf="showText()">Import</span>
        </button>

        <!-- Export Button -->
        <button
          *ngIf="export.subscriberCount && !_hide?.export"
          [disabled]="_disabled?.export ?? false"
          class="btn btn-sm btn-outline-secondary"
          [ngClass]="getDisplayClasses()"
          (click)="onExport($event)"
        >
          <i class="fa-solid fa-file-export" *ngIf="showIcon()"></i>
          <span *ngIf="showText()">Export</span>
        </button>

        <!-- Consumer-projected custom actions (e.g. a form-specific "Create
             Invoice" button) — render alongside the fixed named buttons
             above instead of the caller having to build a separate action
             row. Purely additive: no consumer projects anything today, so
             this is a no-op until one does. -->
        <ng-content></ng-content>

        <!-- Actions dropdown: every projected <action-menu-item> collected into ONE menu, at the
             RIGHT END of the bar (after Save, with an extra gap) so a secondary action is never a
             mis-click away from Save. Same size as the other bar buttons (btn-sm, fills the row).
             Danger items go last, after a divider. Hidden entirely when no item is projected, so
             pages that project none render exactly as before. -->
        <div *ngIf="menuItems?.length" class="dropdown d-flex ms-2" dropdown placement="bottom right">
          <button
            type="button"
            class="btn btn-sm btn-outline-primary d-flex align-items-stretch p-0 h-100"
            [ngClass]="getDisplayClasses()"
            dropdownToggle
            aria-label="Actions"
            aria-haspopup="menu"
          >
            <!-- Looks like a split button — [ Actions | ⋮ ] — but is ONE toggle, so either part opens
                 the menu. The wrapper is `.dropdown`, not `.btn-group`: in a btn-group the button is not
                 the last child (the menu follows it), so Bootstrap squares its right corners. Three dots instead of the caret (no `dropdown-toggle`, which draws the arrow). -->
            <span *ngIf="showText()" class="d-flex align-items-center px-2">Actions</span>
            <span class="d-flex align-items-center px-2" [class.border-start]="showText()" [class.border-primary]="showText()">
              <i class="fa-solid fa-ellipsis-vertical"></i>
            </span>
          </button>
          <!-- The menu sizes to its content (width: max-content; min-width 0 overrides Bootstrap's 10rem),
               capped by max-width so a long item hint wraps (text-wrap on the item); it is absolutely
               positioned, so it never widens the bar. -->
          <ul *dropdownMenu class="dropdown-menu dropdown-menu-end shadow-sm py-1" role="menu" style="min-width: 0; width: max-content; max-width: 22rem">
            <li role="presentation"><h6 class="dropdown-header text-uppercase small fw-semibold text-body-secondary py-1">Actions</h6></li>
            <li *ngFor="let item of regularMenuItems" role="none" [attr.title]="item.hint || null">
              <ng-container *ngTemplateOutlet="menuItemTpl; context: { $implicit: item }"></ng-container>
            </li>
            <li *ngIf="regularMenuItems.length && dangerMenuItems.length" role="separator"><hr class="dropdown-divider" /></li>
            <li *ngIf="dangerMenuItems.length" role="presentation"><h6 class="dropdown-header text-uppercase small fw-semibold text-danger py-1">Can't be undone</h6></li>
            <li *ngFor="let item of dangerMenuItems" role="none" [attr.title]="item.hint || null">
              <ng-container *ngTemplateOutlet="menuItemTpl; context: { $implicit: item }"></ng-container>
            </li>
          </ul>
        </div>
      </div>

      <!-- <action-menu-item> hosts render nothing themselves (their label is stamped into the
           dropdown above); this slot keeps them out of the flex row so they take no gap. -->
      <div class="d-none"><ng-content select="action-menu-item"></ng-content></div>
    </div>
  </div>
</div>
