<!-- Muted hint, not an alert box (design spec §3 rev 16): an explainer is
     information, so it reads as small secondary text; only the icon carries
     the tone colour. Same entry, same text. -->
<div *ngIf="entry() as e" class="form-text text-body-secondary d-flex align-items-start gap-2 mt-1 mb-2" role="status">
  <i class="fa-solid {{ icon() }} text-{{ e.tone }} mt-1"></i>
  <div class="small">{{ e.text }}</div>
</div>
